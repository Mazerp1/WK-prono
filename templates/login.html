<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f4f6f8;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            width: 320px;
        }
        .login-card h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #333;
        }
        .login-card label {
            display: block;
            margin-top: 1rem;
            font-size: 0.95rem;
            color: #555;
        }
        .login-card input {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.35rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .login-card button {
            width: 100%;
            padding: 0.85rem;
            margin-top: 1.5rem;
            border: none;
            border-radius: 8px;
            background: #1d72b8;
            color: white;
            font-size: 1rem;
            cursor: pointer;
        }
        .login-card button:hover {
            background: #155a8a;
        }
        .login-card .info {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #666;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Log in securely</h1>
        <form method="post" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign In</button>
        </form>
        <p class="info">Use HTTPS for secure transmission. Never share your password.</p>
    </main>
</body>
</html>
